<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meridian Task Board — Sign In</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="card">
        <h1>Meridian Task Board</h1>
        <p class="sub">Sign in or create an account</p>
        <label>USERNAME</label>
        <input type="text" id="u" placeholder="yourname">
        <label>PASSWORD</label>
        <input type="password" id="p" placeholder="••••••••">
        <button class="btn" id="login">Sign In</button>
        <button class="btn-secondary" id="register">Create Account</button>
        <div class="err" id="err">Invalid credentials.</div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
