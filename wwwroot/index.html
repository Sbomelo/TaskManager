<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian Task Board</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    /* ── HEADER ─────────────────────────────────────── */
    header { background: #13161f; border-bottom: 1px solid #2d3748;
             padding: 12px 20px; display: flex; align-items: center;
             justify-content: space-between; position: sticky; top: 0; z-index: 20; }
    .brand { font-size: 17px; font-weight: 700; color: #f6ad55; }
    .hdr-right { display: flex; align-items: center; gap: 16px; }
    .conn-pill { display: flex; align-items: center; gap: 6px; font-size: 12px;
                 padding: 4px 11px; border-radius: 20px; background: #1a1f2e;
                 border: 1px solid #2d3748; color: #718096; }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #fc8181; transition: background .3s; }
    .conn-dot.live { background: #68d391; box-shadow: 0 0 5px rgba(104,211,145,.5); }
    .viewer-count { font-size: 12px; color: #718096; }
    .viewer-count span { color: #63b3ed; font-weight: 600; }

    /* ── BOARD SETUP (shown before board is joined) ── */
    .setup-screen { display: flex; align-items: center; justify-content: center;
                    min-height: calc(100vh - 53px); padding: 20px; }
    .setup-card { background: #13161f; border: 1px solid #2d3748; border-radius: 12px;
                  padding: 36px; width: 100%; max-width: 400px; }
    .setup-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .setup-card p { font-size: 14px; color: #718096; margin-bottom: 22px; }
    .setup-field { margin-bottom: 14px; }
    .setup-field label { display: block; font-size: 12.5px; color: #a0aec0;
                          margin-bottom: 5px; font-weight: 500; }
    .setup-field input { width: 100%; background: #0f1117; border: 1px solid #2d3748;
                          border-radius: 7px; padding: 10px 13px; color: #e2e8f0;
                          font-size: 14px; outline: none; transition: border-color .2s; }
    .setup-field input:focus { border-color: #f6ad55; }
    .btn-primary { width: 100%; padding: 11px; background: #c05621; color: white;
                   border: none; border-radius: 7px; font-size: 14px; font-weight: 600;
                   cursor: pointer; transition: background .2s; margin-top: 6px; }
    .btn-primary:hover:not(:disabled) { background: #9c4221; }
    .btn-primary:disabled { background: #2d3748; color: #4a5568; cursor: not-allowed; }

    /* ── BOARD LAYOUT ───────────────────────────────── */
    .board-screen { display: none; flex-direction: column; }
    .board-screen.visible { display: flex; }
    .board-header { padding: 14px 20px; display: flex; align-items: center;
                    justify-content: space-between; border-bottom: 1px solid #2d3748; }
    .board-title { font-size: 18px; font-weight: 700; color: #f6ad55; }
    .add-task-btn { padding: 8px 16px; background: #c05621; color: white; border: none;
                    border-radius: 7px; font-size: 13px; font-weight: 600;
                    cursor: pointer; transition: background .2s; }
    .add-task-btn:hover { background: #9c4221; }
    .columns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px;
               padding: 16px 20px; min-height: calc(100vh - 120px); align-items: start; }
    .column { background: #13161f; border: 1px solid #2d3748; border-radius: 10px;
              display: flex; flex-direction: column; }
    .col-header { padding: 12px 14px; border-bottom: 1px solid #2d3748;
                  display: flex; align-items: center; justify-content: space-between; }
    .col-title { font-size: 13px; font-weight: 600; letter-spacing: .04em; }
    .col-count { font-family: monospace; font-size: 11px; background: #1a1f2e;
                 border: 1px solid #2d3748; padding: 1px 7px; border-radius: 10px;
                 color: #718096; }
    .col-todo .col-title   { color: #a0aec0; }
    .col-prog .col-title   { color: #63b3ed; }
    .col-done .col-title   { color: #68d391; }
    .col-body { padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 8px;
                min-height: 100px; }

    /* ── TASK CARDS ─────────────────────────────────── */
    .task-card { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 8px;
                 padding: 12px 14px; animation: cardIn .25s ease; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .task-card.p-high   { border-left: 3px solid #fc8181; }
    .task-card.p-medium { border-left: 3px solid #f6ad55; }
    .task-card.p-low    { border-left: 3px solid #68d391; }
    .task-title { font-size: 14px; font-weight: 600; color: #e2e8f0; margin-bottom: 5px; }
    .task-desc  { font-size: 12.5px; color: #718096; margin-bottom: 9px; line-height: 1.5; }
    .task-meta  { display: flex; justify-content: space-between; align-items: center;
                  font-size: 11px; color: #4a5568; margin-bottom: 10px; }
    .assignee   { color: #a0aec0; font-weight: 500; }
    .task-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .ta-btn { padding: 4px 10px; border: 1px solid #2d3748; border-radius: 5px;
              font-size: 11px; font-weight: 500; cursor: pointer;
              background: #1a1f2e; color: #a0aec0; transition: all .15s; }
    .ta-btn:hover:not(:disabled) { border-color: #63b3ed; color: #63b3ed; }
    .ta-btn:disabled { color: #4a5568; cursor: not-allowed; }
    .ta-btn.claim { color: #f6ad55; border-color: rgba(246,173,85,.3); }
    .ta-btn.claim:hover { background: rgba(246,173,85,.1); }

    /* ── ADD TASK MODAL ─────────────────────────────── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65);
                     display: none; align-items: center; justify-content: center;
                     z-index: 50; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #13161f; border: 1px solid #2d3748; border-radius: 12px;
             padding: 28px; width: 100%; max-width: 440px; }
    .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
    .mfield { margin-bottom: 14px; }
    .mfield label { display: block; font-size: 12.5px; color: #a0aec0; margin-bottom: 5px; font-weight: 500; }
    .mfield input, .mfield textarea, .mfield select {
      width: 100%; background: #0f1117; border: 1px solid #2d3748;
      border-radius: 7px; padding: 9px 13px; color: #e2e8f0;
      font-size: 14px; font-family: inherit; outline: none; }
    .mfield input:focus, .mfield textarea:focus, .mfield select:focus { border-color: #f6ad55; }
    .mfield textarea { min-height: 80px; resize: vertical; }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
    .btn-cancel { flex: 1; padding: 10px; background: #1a1f2e; color: #a0aec0;
                  border: 1px solid #2d3748; border-radius: 7px;
                  font-size: 14px; cursor: pointer; }
    .btn-submit { flex: 2; padding: 10px; background: #c05621; color: white;
                  border: none; border-radius: 7px; font-size: 14px;
                  font-weight: 600; cursor: pointer; transition: background .2s; }
    .btn-submit:hover { background: #9c4221; }

    /* ── NOTIFICATIONS / TOASTS ─────────────────────── */
    .toast-zone { position: fixed; bottom: 20px; right: 20px; display: flex;
                  flex-direction: column; gap: 8px; z-index: 100; pointer-events: none; }
    .toast { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
             animation: toastIn .3s ease; max-width: 320px; border-left: 3px solid; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .toast.info     { background: #1a1f2e; border-color: #63b3ed; color: #a0aec0; }
    .toast.success  { background: #0f2318; border-color: #68d391; color: #68d391; }
    .toast.error    { background: #1f0f0f; border-color: #fc8181; color: #fc8181; }
    .toast.warn     { background: #1f1500; border-color: #f6ad55; color: #f6ad55; }
  </style>
</head>
<body>

<header>
  <div class="brand">⚡ Meridian Task Board</div>
  <div class="hdr-right">
    <div class="viewer-count"><span id="viewer-n">0</span> viewing</div>
    <div class="conn-pill">
      <div class="conn-dot" id="dot"></div>
      <span id="conn-txt">Connecting...</span>
    </div>
  </div>
</header>

<!-- SETUP SCREEN — shown until user provides name + board ID -->
<div class="setup-screen" id="setup">
  <div class="setup-card">
    <h2>Join a Task Board</h2>
    <p>Enter your name and the board ID to start collaborating in real time.</p>
    <div class="setup-field">
      <label>Your Name</label>
      <input type="text" id="my-name" placeholder="e.g. Alice" maxlength="40">
    </div>
    <div class="setup-field">
      <label>Board ID</label>
      <input type="text" id="board-id" placeholder="e.g. engineering" maxlength="40">
    </div>
    <button class="btn-primary" id="join-btn" disabled>Join Board</button>
  </div>
</div>

<!-- BOARD SCREEN — shown after joining -->
<div class="board-screen" id="board">
  <div class="board-header">
    <div class="board-title" id="board-name-display"></div>
    <button class="add-task-btn" id="open-modal">+ New Task</button>
  </div>
  <div class="columns">
    <div class="column col-todo">
      <div class="col-header">
        <span class="col-title">To Do</span>
        <span class="col-count" id="cnt-todo">0</span>
      </div>
      <div class="col-body" id="col-Todo"></div>
    </div>
    <div class="column col-prog">
      <div class="col-header">
        <span class="col-title">In Progress</span>
        <span class="col-count" id="cnt-prog">0</span>
      </div>
      <div class="col-body" id="col-InProgress"></div>
    </div>
    <div class="column col-done">
      <div class="col-header">
        <span class="col-title">Done</span>
        <span class="col-count" id="cnt-done">0</span>
      </div>
      <div class="col-body" id="col-Done"></div>
    </div>
  </div>
</div>

<!-- ADD TASK MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Create New Task</h3>
    <div class="mfield">
      <label>Title</label>
      <input type="text" id="t-title" placeholder="Task title" maxlength="120">
    </div>
    <div class="mfield">
      <label>Description</label>
      <textarea id="t-desc" placeholder="What needs to be done?"></textarea>
    </div>
    <div class="mfield">
      <label>Priority</label>
      <select id="t-pri">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>
    </div>
    <div class="mfield">
      <label>Due Date (optional)</label>
      <input type="datetime-local" id="t-due">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="close-modal">Cancel</button>
      <button class="btn-submit" id="submit-task">Create Task</button>
    </div>
  </div>
</div>

<div class="toast-zone" id="toasts"></div>

<script>
let myName     = "";             // Set when user fills setup screen   
let myBoardId  = "";             // The board this client has joined            
const taskMap  = new Map();      // taskId → task object (our local state)   

// ── BUILD CONNECTION
const connection = new signalR.HubConnectionBuilder()
    .withUrl("/taskHub")                                  
    .withAutomaticReconnect([0, 2000, 5000, 10000, 30000])         
    .configureLogging(signalR.LogLevel.Information)
    .build();


// Server confirmed our WebSocket connection
connection.on("Connected", function(connectionId, serverTime) {    
    setStatus("Connected", true);
    // Enable the Join button now that the connection is live
    document.getElementById("join-btn").disabled = false;              
});

// Server sends the complete current board state when we join
connection.on("BoardState", function(boardId, tasks) {               
    taskMap.clear();                                                 
    clearAllColumns();                                               
    tasks.forEach(task => {                                               
        taskMap.set(task.id, task);
        renderTaskCard(task, false);                                       
    });
    updateAllCounts();
    showBoard();                                                           
});

// Another user created a new task — add it to our board
connection.on("TaskCreated", function(task) {                            
    taskMap.set(task.id, task);
    renderTaskCard(task, true);                                           
    updateAllCounts();
});

// A task was updated (status change, claim, etc.) — replace its card
connection.on("TaskUpdated", function(task) {                            
    taskMap.set(task.id, task);                                          
    removeTaskCard(task.id);                                              
    renderTaskCard(task, false);                                          
    updateAllCounts();
});

// A viewer joined our board — increment count
connection.on("ViewerJoined", function(connectionId) {                    
    //viewerCount++;
    refreshViewerCount();
    toast("A teammate joined the board", "info");
});

// A viewer left our board — decrement count
connection.on("ViewerLeft", function(connectionId) {                   
   // viewerCount = Math.max(0, viewerCount - 1);
    refreshViewerCount();
});
//Counter handled by the server for accuracy, so we just refresh the displayed count when notified of changes
connection.on("ViewerCountUpdated", (count) => {
    document.getElementById("viewer-n").textContent = count;
});

// Server sent an error (validation failure, task not found, etc.)
connection.on("Error", function(message) {                             
    toast(message, "error");
});

// Server sent an overdue task warning (from OverdueTaskChecker service)
connection.on("OverdueAlert", function(taskTitle, boardId) {           
    toast(`⏰ Overdue: "${taskTitle}"`, "warn");
});

// ── RECONNECTION HANDLERS ── (See Step 7 for full explanation)
connection.onreconnecting(function() {                                    
    setStatus("Reconnecting...", false);
    toast("Connection lost — reconnecting...", "warn");
});

connection.onreconnected(async function(newConnectionId) {                 
    setStatus("Connected", true);
    toast("Reconnected — refreshing board...", "success");
    // Critical: re-join the group with the new connection ID
    if (myBoardId) {
        await connection.invoke("JoinBoard", myBoardId);              
    }
});

connection.onclose(function() {                                       
    setStatus("Disconnected — refresh to reconnect", false);
});

// ── START THE CONNECTION ─────
async function startConnection() {
    try {
        await connection.start();                              
    } catch (err) {
        setStatus("Connection failed — retrying...", false);
        setTimeout(startConnection, 5000);
    }
}
startConnection();

// ── JOIN BOARD ─────────
document.getElementById("join-btn").addEventListener("click", async function() {
    const name    = document.getElementById("my-name").value.trim();
    const boardId = document.getElementById("board-id").value.trim().toLowerCase();

    if (!name || !boardId) { toast("Please fill in both fields.", "error"); return; }

    myName    = name;
    myBoardId = boardId;                                          

    document.getElementById("board-name-display").textContent =
        `📋 ${boardId} board`;
    //viewerCount = 1;                                              
    //refreshViewerCount();

    try {
        await connection.invoke("JoinBoard", boardId);                     
        // showBoard() is called by the BoardState handler, not here
    } catch (err) {
        toast("Failed to join board: " + err.message, "error");
    }
});

// ── MODAL (Add Task) ────
document.getElementById("open-modal").onclick =  () =>
    document.getElementById("modal").classList.add("open");
document.getElementById("close-modal").onclick = () =>
    document.getElementById("modal").classList.remove("open");

document.getElementById("submit-task").addEventListener("click", async function() {
    const title   = document.getElementById("t-title").value.trim();
    const desc    = document.getElementById("t-desc").value.trim();
    const pri     = document.getElementById("t-pri").value;
    const due     = document.getElementById("t-due").value;
    if (!title) { toast("Title is required.", "error"); return; }

    const request = {
        title,
        description: desc,
        priority: pri,
        dueDate: due ? new Date(due).toISOString() : null,           
        createdBy: myName
    };

    try {
        await connection.invoke("CreateTask", myBoardId, request);       
        document.getElementById("modal").classList.remove("open");
        document.getElementById("t-title").value = "";
        document.getElementById("t-desc").value  = "";
    } catch (err) {
        toast("Failed to create task: " + err.message, "error");
    }
});

// ── TASK CARD RENDERING ──────────
function renderTaskCard(task, animate) {                                
    const col     = document.getElementById(`col-${task.status}`);          
    if (!col) return;

    const pri     = (task.priority || "Medium").toLowerCase();
    const isOwner = task.assignedTo === myName;                  
    const created = new Date(task.createdAt).toLocaleTimeString();

    const card = document.createElement("div");
    card.className = `task-card p-${pri}`;
    card.dataset.id = task.id;                              

    // Build action buttons based on task state
    let actions = "";
    if (!task.assignedTo) {
        actions += `<button class="ta-btn claim" onclick="claimTask('${task.id}')">Claim</button>`; 
    }
    if (task.status !== "Done") {
        const nextStatus = task.status === "Todo" ? "InProgress" : "Done";
        const label      = task.status === "Todo" ? "→ Start" : "✓ Complete";
        actions += `<button class="ta-btn" onclick="updateStatus('${task.id}','${nextStatus}')">${label}</button>`; 
    }

    card.innerHTML = `
      <div class="task-title">${esc(task.title)}</div>
      ${task.description ? `<div class="task-desc">${esc(task.description)}</div>` : ""}
      <div class="task-meta">
        <span class="assignee">${task.assignedTo ? "👤 " + esc(task.assignedTo) : "Unassigned"}</span>
        <span>${created}</span>
      </div>
      <div class="task-actions">${actions}</div>`;

    if (animate) {
        col.insertBefore(card, col.firstChild);                      
    } else {
        col.appendChild(card);                                            
    }
}

function removeTaskCard(taskId) {                                   
    const existing = document.querySelector(`[data-id="${taskId}"]`);
    if (existing) existing.remove();
}

function clearAllColumns() {
    ["col-Todo", "col-InProgress", "col-Done"].forEach(id => {
        document.getElementById(id).innerHTML = "";
    });
}

function updateAllCounts() {
    const tasks = [...taskMap.values()];
    document.getElementById("cnt-todo").textContent = tasks.filter(t => t.status === "Todo").length;
    document.getElementById("cnt-prog").textContent = tasks.filter(t => t.status === "InProgress").length;
    document.getElementById("cnt-done").textContent = tasks.filter(t => t.status === "Done").length;
}

// ── ACTIONS (called from button onclick attributes) ───────
async function updateStatus(taskId, newStatus) {
    try {
        await connection.invoke("UpdateTaskStatus", myBoardId, taskId, newStatus);  
    } catch (err) { toast(err.message, "error"); }
}

async function claimTask(taskId) {
    if (!myName) { toast("Set your name first.", "error"); return; }
    try {
        await connection.invoke("ClaimTask", myBoardId, taskId, myName);       
    } catch (err) { toast(err.message, "error"); }
}

// ── HELPERS ─
function showBoard() {
    document.getElementById("setup").style.display = "none";
    document.getElementById("board").classList.add("visible");
}
function setStatus(text, live) {
    document.getElementById("conn-txt").textContent = text;
    document.getElementById("dot").classList.toggle("live", live);
}
/*function refreshViewerCount() {
    document.getElementById("viewer-n").textContent = viewerCount;
}*/
function esc(text) {
    const d = document.createElement("div");
    d.appendChild(document.createTextNode(text || ""));
    return d.innerHTML;
}
function toast(msg, type = "info") {
    const el = document.createElement("div");
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById("toasts").appendChild(el);
    setTimeout(() => el.remove(), 4000);                                // Toast auto-removes after 4s
}
</script>
</body>
</html>
